[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "caddy-mcp"
version = "2.3.7"
description = "Caddy Reverse Proxy MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.3,<0.7.0",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
caddy-mcp = "scion_sdk.cli:serve"

[project.entry-points."scion_sdk.prompt_providers"]
caddy-mcp = "caddy_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
caddy-mcp = "caddy_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
caddy_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pytest.ini_options]
markers = ["concept(id): associate a test with its existing concept identifier"]

[tool.pipelines.container]
compose_env = ["CADDY_URL", "CADDY_TOKEN"]
